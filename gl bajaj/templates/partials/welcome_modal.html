<!-- First-visit login guide for guests (shown on the homepage, once per browser tab session) -->
<div class="ka-welcome" id="kaWelcome" role="dialog" aria-modal="true" aria-labelledby="kaWelcomeTitle" hidden>
  <div class="ka-welcome-card">
    <div class="ka-welcome-badge">Swagat hai</div>
    <h2 id="kaWelcomeTitle">KaamNearby mein kaam karwane ke liye login karein</h2>
    <p>Login ke baad aap booking kar sakte hain, apni bookings dekh sakte hain, aur kaam ki price tay kar sakte hain.</p>

    <div class="ka-welcome-actions">
      <a class="ka-welcome-btn ka-welcome-primary" href="{{ url_for('login') }}">Login karein</a>
      <a class="ka-welcome-btn" href="{{ url_for('register') }}">Naya account banayein</a>
    </div>

    <button type="button" class="ka-welcome-skip" id="kaWelcomeSkip">Abhi nahi, baad me</button>
  </div>
</div>
